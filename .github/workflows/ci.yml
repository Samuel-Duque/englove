name: CI y despliegue a staging

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      fullstack:
        description: Ejecutar Playwright con PostgreSQL, MinIO y API sembrada
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, tipos, PostgreSQL, pruebas y build
    runs-on: ubuntu-latest
    services:
      postgres: &postgres
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: upward_english_ci
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d upward_english_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio: &minio
        image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['127.0.0.1:9000:9000']
    env:
      DATABASE_URL: &ci-database postgresql://postgres:postgres@127.0.0.1:5433/upward_english_ci
      MIGRATION_DATABASE_URL: *ci-database
      # Credenciales desechables del servicio local de este runner.
      R2_ACCOUNT_ID: &r2-account local
      R2_ENDPOINT: &r2-endpoint http://127.0.0.1:9000
      R2_BUCKET_NAME: &r2-bucket upward-english-dev
      R2_ACCESS_KEY_ID: &r2-key minioadmin
      R2_SECRET_ACCESS_KEY: &r2-secret minioadmin
      REQUIRE_POSTGRES_TESTS: '1'
      RUN_AUDIT_MIGRATION_POSTGRES: '1'
      AUDIT_MIGRATION_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
    steps:
      - &checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - &setup-pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.1
      - &setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - &init-minio
        name: Inicializar bucket privado en MinIO
        run: |
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-max-time 45 --max-time 5 "$R2_ENDPOINT/minio/health/ready"
          docker run --rm --network host --entrypoint /bin/sh \
            -e R2_ENDPOINT -e R2_ACCESS_KEY_ID -e R2_SECRET_ACCESS_KEY -e R2_BUCKET_NAME \
            pgsty/mc@sha256:b532278b7a3747dbab6fe45eebb40a653efa704e6758e24e9d9ec54fc96c1800 -ec '
              /usr/bin/mc alias set ci "$R2_ENDPOINT" "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY"
              /usr/bin/mc mb --ignore-existing "ci/$R2_BUCKET_NAME"
              /usr/bin/mc anonymous set none "ci/$R2_BUCKET_NAME"
            '
      - &install-ffmpeg
        name: Instalar y verificar ffmpeg y ffprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Bloquear dependencias con avisos moderados o altos
        run: pnpm audit --prod --audit-level=moderate
      - run: node scripts/check-no-db-push.mjs
      - run: pnpm guardrails
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrar exclusivamente la base efímera de pruebas
        run: pnpm db:migrate
      - run: pnpm build
      - name: Ejecutar las pruebas sin reutilizar resultados de otra base
        run: pnpm test
      - run: node --test scripts/*.test.mjs
      - name: Empaquetado real y presupuesto gzip del Worker
        run: node scripts/check-worker-size.mjs

  docker-build:
    name: Imagen Linux de la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -f apps/api/Dockerfile -t upward-english-api:ci .
      - name: Verificar binarios y cliente generado en la imagen final
        run: |
          docker run --rm --entrypoint sh upward-english-api:ci -c 'ffmpeg -version && ffprobe -version && node -e "require(\"@prisma/client\"); require(\"argon2\"); require(\"@upward-english/shared\")"'

  e2e-tests:
    name: Playwright y accesibilidad
    needs: [quality-gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @upward-english/shared build
      - run: pnpm --filter @upward-english/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=mocked-ci
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
      - name: Evidencia de navegador incluso ante fallo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ github.sha }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore

  fullstack:
    name: Playwright con API sembrada
    if: github.event_name == 'workflow_dispatch' && inputs.fullstack
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres: *postgres
      minio: *minio
    env:
      APP_ENV: local
      DATABASE_URL: *ci-database
      MIGRATION_DATABASE_URL: *ci-database
      R2_ACCOUNT_ID: *r2-account
      R2_ENDPOINT: *r2-endpoint
      R2_BUCKET_NAME: *r2-bucket
      R2_ACCESS_KEY_ID: *r2-key
      R2_SECRET_ACCESS_KEY: *r2-secret
      WEB_BASE_URL: http://localhost:3000
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      COOKIE_PREFIX: upward_english_local_
      NEXT_PUBLIC_COOKIE_PREFIX: upward_english_local_
      MAIL_FROM: ci@example.invalid
    steps:
      - *checkout
      - *setup-pnpm
      - *setup-node
      - run: pnpm install --frozen-lockfile
      - *init-minio
      - *install-ffmpeg
      - run: pnpm db:migrate
      - run: pnpm exec turbo run build --filter=@upward-english/api
      - run: pnpm seed:dev
      - run: pnpm --filter @upward-english/web exec playwright install --with-deps chromium
      - name: Arrancar API y ejecutar Playwright fullstack
        working-directory: apps/api
        run: |
          node dist/src/main.js > "$RUNNER_TEMP/fullstack-api.log" 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-max-time 45 --max-time 5 "$API_URL/health"
          pnpm -w test:e2e --project=fullstack
      - name: Conservar trazas y logs de fullstack
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-fullstack-${{ github.sha }}
          path: |
            apps/web/test-results/
            ${{ runner.temp }}/fullstack-api.log
          if-no-files-found: ignore

  staging-deploy:
    name: Migrar y desplegar el mismo commit
    needs: [quality-gates, docker-build, e2e-tests]
    if: >-
      github.event_name != 'pull_request' &&
      !inputs.fullstack &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') &&
      vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: upward-english-staging
      cancel-in-progress: false
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: staging
      API_URL: ${{ vars.STAGING_API_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      NEXT_PUBLIC_APP_ENV: staging
      COOKIE_PREFIX: upward_english_stg_
      NEXT_PUBLIC_COOKIE_PREFIX: upward_english_stg_
      DEPLOY_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Validar configuración antes de cualquier mutación
        run: node scripts/deploy-render.mjs --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-worker-size.mjs
      - name: Migración por conexión directa de staging
        run: pnpm db:migrate
      - name: API en Render, commit exacto y health satisfactorio
        run: node scripts/deploy-render.mjs
      - name: Worker construido desde el mismo commit
        run: pnpm --filter @upward-english/web exec wrangler deploy --config dist/server/wrangler.json
      - name: Comprobar frontend publicado
        run: node scripts/deploy-render.mjs --check-web
