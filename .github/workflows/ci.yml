name: CI y despliegue a staging

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, tipos, PostgreSQL, pruebas y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: englove_ci
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d englove_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/englove_ci
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/englove_ci
      REQUIRE_POSTGRES_TESTS: '1'
      RUN_AUDIT_MIGRATION_POSTGRES: '1'
      AUDIT_MIGRATION_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bloquear dependencias con avisos moderados o altos
        run: pnpm audit --prod --audit-level=moderate
      - run: node scripts/check-no-db-push.mjs
      - run: pnpm guardrails
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrar exclusivamente la base efímera de pruebas
        run: pnpm db:migrate
      - run: pnpm build
      - name: Ejecutar las pruebas sin reutilizar resultados de otra base
        run: pnpm test
      - run: node --test scripts/*.test.mjs
      - name: Empaquetado real y presupuesto gzip del Worker
        run: node scripts/check-worker-size.mjs

  docker-build:
    name: Imagen Linux de la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t englove-api:ci .
      - name: Verificar binarios y cliente generado en la imagen final
        run: |
          docker run --rm --entrypoint sh englove-api:ci -c 'ffmpeg -version && ffprobe -version && node -e "require(\"@prisma/client\"); require(\"argon2\"); require(\"@englove/shared\")"'

  e2e-tests:
    name: Playwright y accesibilidad
    needs: [quality-gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @englove/shared build
      - run: pnpm --filter @englove/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Evidencia de navegador incluso ante fallo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.sha }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore

  staging-deploy:
    name: Migrar y desplegar el mismo commit
    needs: [quality-gates, docker-build, e2e-tests]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') &&
      vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: englove-staging
      cancel-in-progress: false
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: staging
      API_URL: ${{ vars.STAGING_API_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      NEXT_PUBLIC_APP_ENV: staging
      COOKIE_PREFIX: englove_stg_
      NEXT_PUBLIC_COOKIE_PREFIX: englove_stg_
      DEPLOY_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validar configuración antes de cualquier mutación
        run: node scripts/deploy-render.mjs --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-worker-size.mjs
      - name: Migración por conexión directa de staging
        run: pnpm db:migrate
      - name: API en Render, commit exacto y health satisfactorio
        run: node scripts/deploy-render.mjs
      - name: Worker construido desde el mismo commit
        run: pnpm --filter @englove/web exec wrangler deploy --config dist/server/wrangler.json
      - name: Comprobar frontend publicado
        run: node scripts/deploy-render.mjs --check-web
