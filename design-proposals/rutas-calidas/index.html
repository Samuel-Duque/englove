<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Englove · Estudio de identidad</title>
<style>
*{box-sizing:border-box}body{margin:0;--ink:#421828;--paper:#fff5df;--accent:#ff8840;--light:#ffdc77;--deep:#632043;background:var(--paper);color:var(--ink);font:17px/1.5 "Segoe UI",sans-serif}button,select,a{font:inherit;color:inherit}a{text-decoration:none}button,select{cursor:pointer}button,a.nav,select,.action{min-height:48px}.review,header,main{padding-inline:max(5vw,calc((100vw - 1160px)/2))}.review{background:#30252a;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}.review select{background:#30252a;color:white;border:0;font-weight:650}header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:20px;border-bottom:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}.brand{font-size:32px;font-weight:900;letter-spacing:-2px;display:flex;align-items:center;gap:10px}.symbol{width:30px;height:27px;background:var(--deep);border-radius:55% 55% 55% 12%;display:grid;place-items:center;color:white;font:900 13px Georgia;letter-spacing:1px}.nav{display:inline-grid;place-items:center;padding:0 16px;border-bottom:3px solid transparent}.nav[aria-current]{border-color:var(--deep);font-weight:bold}.avatar{border:1px solid;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;font-weight:800}main{padding-block:32px 64px}.hero{position:relative;isolation:isolate;overflow:hidden;background:var(--accent);border-radius:30px;padding:40px 5%;min-height:235px;display:flex;align-items:center}.hero>div:first-child{max-width:60%;z-index:1}.hero p{margin:0 0 10px;font-weight:700}.hero h1,h1{font-size:clamp(40px,5.2vw,78px);line-height:1.02;letter-spacing:-.055em;margin:0;font-weight:850}.art{width:31%;height:78%;position:absolute;right:5%;bottom:9%;display:grid;place-items:center}.radio .art{border:7px solid var(--ink);border-radius:28px;background:var(--light);box-shadow:6px 7px var(--ink);transform:rotate(-4deg)}.radio .art:before{content:"";width:74%;height:39%;border-radius:100px 100px 0 0;background:repeating-conic-gradient(from -90deg at 50% 100%,var(--ink) 0 2deg,transparent 2deg 14deg);border-bottom:5px solid}.radio .art:after{content:"";width:72%;height:18px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px);border-radius:8px}.teatro{--ink:#531a20;--paper:#fff2d7;--accent:#f7bc54;--light:#ffdf96;--deep:#842437}.teatro h1,.teatro h2,.teatro .brand{font-family:Georgia,serif}.teatro .hero{border-radius:4px;border-block:7px solid var(--deep)}.teatro .art{background:repeating-linear-gradient(100deg,#972d38 0 14px,#742033 15px 30px);border-radius:0 0 42% 42%;inset:0 0 auto auto;height:83%;transform:rotate(-6deg)}.teatro .art:after{content:"✦";font-size:100px;color:var(--light);text-shadow:4px 6px var(--ink)}.herbario{--paper:#fcf2dc;--ink:#452b1f;--accent:#eccc91;--deep:#843923;--light:#f2deb4}.herbario h1,.herbario h2,.herbario .brand{font-family:Georgia,serif;font-weight:500}.herbario .hero{border-radius:3px 34px 34px 3px;border-left:12px double #986539;background:repeating-linear-gradient(0deg,transparent 0 31px,#97744440 32px),var(--accent)}.herbario .art{transform:rotate(22deg);background:linear-gradient(90deg,transparent 49%,#82532b 49% 51%,transparent 51%)}.herbario .art i{width:42%;height:22%;position:absolute;left:8%;top:18%;border-radius:2% 90%;background:#a55a31;box-shadow:25px 48px #b67f38}.herbario .art i:after{content:"";position:absolute;width:100%;height:100%;left:100%;top:42%;border-radius:90% 2%;background:#875032}
h2{font-size:clamp(27px,3vw,40px);letter-spacing:-.04em;line-height:1.1;margin:0}h3{margin:0;font-size:22px;letter-spacing:-.03em}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:32px 0 16px}.filters{display:flex;gap:4px;flex-wrap:wrap}button,.action{border:1px solid currentColor;background:transparent;border-radius:12px;padding:9px 16px;font-weight:650}.filters button{border:0}.filters [aria-pressed=true]{background:var(--light)}.action,.primary{display:inline-grid;place-items:center;background:var(--deep);color:white;border-color:var(--deep)}.row{border-top:1px solid #907c66;display:flex;align-items:center;gap:16px;padding:20px 0}.row>div:nth-child(2){flex:1}.row p,.tile p{margin:3px 0}.mark{font: bold 26px Georgia;border-radius:10px;background:var(--light);width:58px;height:62px;display:grid;place-items:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.tile,.exercise{padding:26px;border:1px solid #9e8970;border-radius:16px;background:#ffffff40}.tile .action{margin-top:16px}.exercise{max-width:720px;margin:22px auto}.exercise h1{font-size:clamp(32px,4vw,48px);margin:16px 0 24px}.exercise button{margin:4px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.choices [aria-pressed=true]{background:var(--light);outline:2px solid}.note{border-left:5px solid var(--deep);padding:10px 16px;background:var(--light)}:focus-visible{outline:3px solid #075bb3;outline-offset:3px}button:disabled{opacity:.55;cursor:default}.herbario .tile,.herbario .exercise{border-radius:0}.teatro .tile{border:2px dashed var(--deep)}@media(max-width:680px){header{flex-wrap:wrap;padding-block:10px;gap:4px}nav{order:3;width:100%;display:flex}.nav{flex:1}.brand{font-size:28px}.hero{padding:24px;min-height:190px}.hero h1{font-size:38px}.art{width:24%;height:45%}.hero>div:first-child{max-width:72%}.grid{grid-template-columns:1fr}.row{gap:10px;flex-wrap:wrap}.mark{width:42px;height:46px}.row h3{font-size:19px}.review{font-size:12px}.sectionhead{margin-top:24px}}
</style>
<body class="radio"><aside class="review"><span>Estudio de identidad · Demo local</span><label>Propuesta <select id="theme"><option value="radio">Radio Mandarina</option><option value="teatro">Teatro de bolsillo</option><option value="herbario">Herbario de palabras</option></select></label></aside><header><a href="#inicio" class="brand"><span class="symbol" aria-hidden="true">••</span>Englove</a><nav aria-label="Principal"><a class="nav" href="#inicio">Inicio</a><a class="nav" href="#juegos">Juegos</a><a class="nav" href="#progreso">Mi progreso</a></nav><span class="avatar" aria-label="Luna">L</span></header><main id="main" tabindex="-1"></main>
<script>
const main=document.querySelector('main'),theme=document.querySelector('select')
const mottos={radio:'Tu inglés tiene voz.',teatro:'Tu inglés entra en escena.',herbario:'Palabra a palabra, algo crece.'}
let filter='Todas',finished=false,selection='',checked=false,words=[],matches=[],flipped=[],turn=0
const deck=['cat','perro','gato','dog'],pairs={cat:'gato',gato:'cat',dog:'perro',perro:'dog'}
const titles={inicio:'Inicio',juegos:'Zona de juegos',progreso:'Mi progreso',actividad:'Los animales',orden:'Ordena la frase',memoria:'Parejas de animales',historial:'Mi presentación'}
const route=()=>Object.hasOwn(titles,location.hash.slice(1))?location.hash.slice(1):'inicio'
const link=(href,label)=>'<a class="action" href="#'+href+'">'+label+'</a>'
const button=(action,label,attrs='')=>'<button data-act="'+action+'" '+attrs+'>'+label+'</button>'
const hero=(lead,title)=>'<section class="hero"><div><p>'+lead+'</p><h1>'+title+'</h1></div><div class="art" aria-hidden="true"><i></i></div></section>'
const row=(icon,title,sub,action)=>'<article class="row"><span class="mark" aria-hidden="true">'+icon+'</span><div><h3>'+title+'</h3><p>'+sub+'</p></div>'+action+'</article>'
const filters=['Todas','Por hacer','Entregadas']
function home(){return hero('Hola, Luna',mottos[theme.value])+'<div class="sectionhead"><h2>Mis actividades</h2><div class="filters">'+filters.map(f=>button('filter',f,'value="'+f+'" aria-pressed="'+(filter===f)+'"')).join('')+'</div></div>'+((filter==='Todas'||filter===(finished?'Entregadas':'Por hacer'))?row('Aa','Los animales','Vocabulario · '+(finished?'Entregada':'Por hacer'),link('actividad',finished?'Ver respuesta':'Empezar')):'')+(filter!=='Por hacer'?row('Hi','Mi presentación','Escritura · Entregada',link('historial','Ver entrega')):'')+(filter==='Por hacer'&&finished?'<p>Has entregado todas tus actividades.</p>':'')}
function games(){return hero('Práctica libre','Zona de juegos')+'<div class="sectionhead"><h2>Elige una partida</h2></div><div class="grid">'+[['Parejas de animales','Encuentra cada palabra y su traducción.','memoria'],['Ordena la frase','Toca las palabras para formar una oración.','orden']].map(([t,s,h])=>'<article class="tile"><h3>'+t+'</h3><p>'+s+'</p>'+link(h,'Jugar')+'</article>').join('')+'</div>'}
function progress(){return hero('Mi progreso','Dos semanas seguidas.')+'<div class="sectionhead"><h2>Mis insignias</h2></div><article class="tile"><h3>✦ Primer paso</h3><p>Completaste tu primera actividad.</p></article><div class="sectionhead"><h2>Historial de actividades</h2></div>'+ (finished?row('Aa','Los animales','Entregada',link('actividad','Ver respuesta')):'')+row('Hi','Mi presentación','Calificada · 5,0 / 5,0',link('historial','Ver entrega'))}
function detail(p){let body=''
if(p==='historial')body='<h1>Mi presentación</h1><p>Tu entrega</p><blockquote lang="en">Hello! My name is Luna.</blockquote><p class="note">Calificación de la profesora · 5,0 / 5,0</p>'
if(p==='actividad')body='<h1>¿Cómo se dice «gato» en inglés?</h1>'+(checked?'<p class="note">'+(selection==='Cat'?'¡Así es! Gato se dice cat.':'Elegiste '+selection+'. '+selection+' significa '+(selection==='Dog'?'perro':'pájaro')+'. Gato se dice cat.')+'</p>'+link('inicio','Volver a mis actividades'):'<div class="choices">'+['Cat','Dog','Bird'].map(w=>button('select',w,'value="'+w+'" aria-pressed="'+(w===selection)+'"')).join('')+'</div>'+button('check','Comprobar','class="primary" '+(!selection?'disabled':'')))
if(p==='orden')body='<h1>Ordena la frase</h1><p>Forma «Me gustan los gatos» en inglés.</p><p class="note">'+(words.join(' ')||'Tu frase aparecerá aquí.')+'</p><div class="choices">'+['cats','I','like'].map(w=>button('word',w,'value="'+w+'" '+(words.includes(w)?'disabled':''))).join('')+'</div>'+(words.length===3?'<p role="status">'+(words.join(' ')==='I like cats'?'¡Así es! I like cats.':'Prueba con el sujeto al principio.')+'</p>':'')+button('resetWords','Volver a ordenar')
if(p==='memoria')body='<h1>Parejas de animales</h1><p>Encuentra la palabra en español y su pareja en inglés.</p><div class="grid">'+deck.map((w,i)=>button('flip',matches.includes(i)?'✓ '+w:flipped.includes(i)?w:'Tarjeta '+(i+1),'value="'+i+'" '+(matches.includes(i)||flipped.includes(i)||flipped.length===2?'disabled':''))).join('')+'</div><p role="status">'+(matches.length===4?'¡Encontraste las dos parejas!':flipped.length===2?'Estas palabras no forman pareja.':'Parejas encontradas: '+matches.length/2+' de 2.')+'</p>'+(flipped.length===2?button('hide','Seguir buscando'):'')+(matches.length===4?button('restart','Jugar de nuevo'):'')
return '<section class="exercise"><a href="#'+(['orden','memoria'].includes(p)?'juegos':p==='historial'?'progreso':'inicio')+'">← Volver</a>'+body+'</section>'}
function render(){let p=route();document.title=titles[p]+' · Englove';document.body.className=theme.value;document.querySelectorAll('.nav').forEach(a=>{a.removeAttribute('aria-current');if(a.hash==='#'+({actividad:'inicio',orden:'juegos',memoria:'juegos',historial:'progreso'}[p]||p))a.setAttribute('aria-current','page')});main.innerHTML=p==='inicio'?home():p==='juegos'?games():p==='progreso'?progress():detail(p)}
main.onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const v=b.value;switch(b.dataset.act){case 'filter':filter=v;break;case 'select':selection=v;break;case 'check':checked=finished=true;break;case 'word':words.push(v);break;case 'resetWords':words=[];break;case 'flip':flipped.push(+v);if(flipped.length===2&&pairs[deck[flipped[0]]]===deck[flipped[1]]){matches.push(...flipped);flipped=[]}break;case 'hide':flipped=[];break;case 'restart':matches=[];flipped=[];break}render();const next=[...main.querySelectorAll('button:not(:disabled)')].find(x=>x.dataset.act===b.dataset.act&&x.value===v);(next||main.querySelector('button:not(:disabled),.action')||main).focus({preventScroll:true})}
theme.onchange=render;onhashchange=()=>{words=[];matches=[];flipped=[];render();main.focus();scrollTo(0,0)};render()
</script></body></html>
