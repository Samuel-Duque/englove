services:
  postgres:
    image: postgres:18-alpine
    container_name: englove-postgres
    restart: unless-stopped
    # Mapeo en puerto local 5433 para evitar colisiones con instancias nativas de PostgreSQL en 5432
    # Pruebas en tablets externas / LAN (QA-08):
    # navigator.mediaDevices (micrófono en speaking) y los Service Workers requieren contexto seguro (localhost o HTTPS).
    # Al probar desde tablets en red local, usar mkcert (o túnel inverso como cloudflared/ngrok) para exponer la app web bajo HTTPS.
    # En ese caso, configurar WEB_BASE_URL con https:// y las cookies se emitirán con flag Secure automáticamente.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: englove_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d englove_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - englove_pgdata:/var/lib/postgresql

  # MinIO emulador S3 para Cloudflare R2 en local (RF-15, decisión 134)
  # Bucket privado: las URLs prefirmadas se validan con firma estricta (sin acceso anónimo, regla G-B10)
  # Nota: se usa el mirror pgsty/minio y pgsty/mc tras la restricción de Docker Hub para minio oficial
  minio:
    image: pgsty/minio:latest
    container_name: englove-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - englove_miniodata:/data

  minio-init:
    image: pgsty/mc:latest
    container_name: englove-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin; do
        echo 'Esperando a MinIO...'
        sleep 1
      done;
      /usr/bin/mc mb -p localminio/englove-dev;
      exit 0;
      "

  # Mailpit para captura SMTP local de correos transaccionales (RF-15, decisión 134)
  mailpit:
    image: axllent/mailpit:latest
    container_name: englove-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI / HTTP API
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  englove_pgdata:
  englove_miniodata:

