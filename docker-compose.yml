services:
  postgres:
    image: postgres:18-alpine
    container_name: englove-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: englove_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d englove_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - englove_pgdata:/var/lib/postgresql

  # MinIO es opcional como emulador S3 para Cloudflare R2 en local (RF-19)
  # Para levantarlo: docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    container_name: englove-minio
    restart: unless-stopped
    profiles:
      - storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - englove_miniodata:/data

volumes:
  englove_pgdata:
  englove_miniodata:
