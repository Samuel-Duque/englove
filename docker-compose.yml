services:
  postgres:
    image: postgres:18-alpine
    container_name: englove-postgres
    restart: unless-stopped
    # Mapeo exclusivo en loopback (127.0.0.1:5433) para evitar exposición LAN y colisiones con Postgres nativo en 5432 (RT-10)
    # Pruebas en tablets externas / LAN (QA-08):
    # navigator.mediaDevices (micrófono en speaking) y los Service Workers requieren contexto seguro (localhost o HTTPS).
    # Al probar desde tablets en red local, usar mkcert o túnel inverso (cloudflared/ngrok) SOLO hacia el frontend HTTPS,
    # manteniendo Postgres/MinIO/Mailpit aislados en loopback y con credenciales propias vía .env cuando haya varios usuarios.
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-englove_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-englove_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - englove_pgdata:/var/lib/postgresql

  # MinIO emulador S3 para Cloudflare R2 en local (RF-15, decisión 134)
  # Bucket privado: las URLs prefirmadas se validan con firma estricta (sin acceso anónimo, regla G-B10)
  # Nota: se usa el mirror pgsty/minio y pgsty/mc tras la restricción de Docker Hub para minio oficial
  minio:
    image: pgsty/minio:latest
    container_name: englove-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - englove_miniodata:/data

  minio-init:
    image: pgsty/mc:latest
    container_name: englove-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set localminio http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        echo 'Esperando a MinIO...'
        sleep 1
      done;
      /usr/bin/mc mb -p localminio/englove-dev;
      exit 0;
      "

  # Mailpit para captura SMTP local de correos transaccionales (RF-15, decisión 134)
  mailpit:
    image: axllent/mailpit:latest
    container_name: englove-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI / HTTP API
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  englove_pgdata:
  englove_miniodata:

